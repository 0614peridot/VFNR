<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191d" />
    <title>Virtual FNR Tutorial Prototype</title>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <canvas id="experience" aria-label="Virtual FNR tutorial 3D scene"></canvas>
      <section id="entry-panel" class="panel" aria-labelledby="entry-title">
        <p class="eyebrow">Low-fidelity prototype</p>
        <h1 id="entry-title">Virtual FNR Tutorial</h1>
        <p id="entry-message">Preparing the shared 3D experience…</p>
        <div class="actions">
          <button id="enter-vr" type="button" hidden>Enter VR</button>
          <button id="continue-screen" type="button" disabled>Continue on Screen</button>
          <button id="retry" class="secondary" type="button" hidden>Retry</button>
        </div>
        <p id="support-note" class="support-note" role="status"></p>
      </section>
      <aside id="mode-status" class="mode-status" hidden></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
