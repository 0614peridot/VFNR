<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191d" />
    <title>Virtual FNR Tutorial Prototype</title>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <canvas id="experience" aria-label="Virtual FNR tutorial 3D scene"></canvas>
      <section id="entry-panel" class="panel" aria-labelledby="entry-title">
        <p class="eyebrow">Low-fidelity prototype</p>
        <h1 id="entry-title">Virtual FNR Tutorial</h1>
        <p id="entry-message">Preparing the shared 3D experience…</p>
        <div class="actions">
          <button id="enter-vr" type="button" hidden>Enter VR</button>
          <button id="continue-screen" type="button" disabled>Continue on Screen</button>
          <button id="retry" class="secondary" type="button" hidden>Retry</button>
        </div>
        <p id="support-note" class="support-note" role="status"></p>
      </section>
      <aside id="mode-status" class="mode-status" hidden></aside>
      <!-- PROVISIONAL: engineering placeholder until the Figma menu and map designs exist. -->
      <button id="menu-toggle" class="menu-toggle secondary" type="button" aria-controls="desktop-menu" aria-expanded="false" hidden>Menu (Tab)</button>
      <section id="desktop-menu" class="desktop-menu" aria-label="Menu" hidden>
        <div id="desktop-menu-root" class="actions">
          <button id="desktop-menu-open-map" type="button">Map</button>
          <button id="desktop-menu-close" class="secondary" type="button">Close</button>
        </div>
        <div id="desktop-menu-map" hidden>
          <div id="desktop-map-area" class="map-area" aria-label="Map destinations"></div>
          <button id="desktop-map-back" class="secondary" type="button">Back</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
